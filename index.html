  <body class="bg-[#100F0E] text-[#F3EFEA] antialiased selection:bg-[#4A1521] selection:text-[#FBF9F5] overflow-x-hidden">
    <!-- Subtle analog film grain texture SVG filter -->
    <svg class="pointer-events-none fixed isolate z-50 opacity-[0.045] mix-blend-overlay w-full h-full inset-0" aria-hidden="true">
      <filter id="noiseFilter">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>
      <rect width="100%" height="100%" filter="url(#noiseFilter)" />
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
